[package]
name = "autarky"
version = "0.1.0"
edition = "2021"
description = "Local LLM benchmark launcher for llama-server"
license = "MIT"
repository = "https://github.com/sadraii/autarky"
include = ["src/**", "prompts/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[[bin]]
name = "autarky"
path = "src/main.rs"

[lib]
name = "autarky"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json", "query", "stream", "rustls"], default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
dirs = "5"
sys-info = "0.9"
toml = "0.8"
csv = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "std"] }
crossterm = "0.29.0"
unicode-width = "0.2"
unicode-truncate = "2.0.1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
